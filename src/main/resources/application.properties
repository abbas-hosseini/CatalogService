spring.application.name=competency-management
server.address=127.0.0.1
spring.datasource.url=${APP_DB_URL:jdbc:postgresql://localhost:5433/Competency}
spring.datasource.username=${APP_DB_USERNAME:postgres}
spring.datasource.password=${APP_DB_PASSWORD:123456}
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.web.error.include-message=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.security.bootstrap.username=${APP_ADMIN_USERNAME:admin}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_SECURE_COOKIES:false}
server.servlet.session.tracking-modes=cookie
