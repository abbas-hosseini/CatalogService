spring.application.name=competency-management
server.address=127.0.0.1
spring.datasource.url=${APP_DB_URL:jdbc:h2:file:./data/competencies;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
spring.datasource.username=${APP_DB_USERNAME:sa}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.web.error.include-message=never
